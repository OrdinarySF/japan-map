<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>大阪 × 东京 行程地图</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* DESIGN.md tokens — restrained product dark, mobile-first */
    :root {
      --bg: oklch(0.16 0.02 250);
      --surface: oklch(0.22 0.025 250);
      --surface-2: oklch(0.28 0.03 250);
      --surface-3: oklch(0.32 0.03 250);
      --border: oklch(0.38 0.02 250);
      --border-strong: oklch(0.48 0.03 250);
      --ink: oklch(0.96 0.01 250);
      --ink-muted: oklch(0.74 0.02 250);
      --ink-faint: oklch(0.58 0.02 250);
      --accent: oklch(0.62 0.16 255);
      --accent-hover: oklch(0.58 0.17 255);
      --accent-2: oklch(0.72 0.12 200);
      --ok: oklch(0.72 0.14 150);
      --warn-bg: oklch(0.28 0.05 75);
      --warn-ink: oklch(0.88 0.08 85);
      --danger: oklch(0.72 0.14 25);
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 12px oklch(0 0 0 / 0.35);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      --sat: 0px;
      --sab: 0px;
      --sal: 0px;
      --sar: 0px;
      --z-map: 0;
      --z-chrome: 20;
      --z-fab: 30;
      --z-sheet: 40;
      --z-scrim: 45;
      --z-aux: 50;
      --z-unlock: 60;
      --top-chrome-h: 52px;
      --day-sheet-h: 42dvh;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    @supports (padding: env(safe-area-inset-top)) {
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    button, input, select { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    /* —— App shell: map fills viewport —— */
    #mapShell {
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
      z-index: var(--z-map);
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Leaflet controls clear of top chrome + bottom sheet */
    .leaflet-top.leaflet-left {
      top: calc(var(--top-chrome-h) + var(--sat) + 10px);
      left: calc(10px + var(--sal));
    }

    .leaflet-bottom.leaflet-right {
      bottom: calc(var(--day-sheet-h) + var(--sab) + 16px);
      right: calc(10px + var(--sar));
    }

    .leaflet-control-attribution {
      max-width: 46vw;
      font-size: 9px !important;
      background: oklch(0.16 0.02 250 / 0.7) !important;
      color: var(--ink-faint) !important;
      margin: 0 !important;
    }

    /* —— Top chrome (floating) —— */
    .top-chrome {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: var(--z-chrome);
      padding-top: calc(8px + constant(safe-area-inset-top));
      padding-top: calc(8px + env(safe-area-inset-top, 0px));
      padding-top: calc(8px + var(--sat));
      padding-right: calc(10px + constant(safe-area-inset-right));
      padding-right: calc(10px + env(safe-area-inset-right, 0px));
      padding-right: calc(10px + var(--sar));
      padding-bottom: 0;
      padding-left: calc(10px + constant(safe-area-inset-left));
      padding-left: calc(10px + env(safe-area-inset-left, 0px));
      padding-left: calc(10px + var(--sal));
      pointer-events: none;
    }

    .top-bar {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 6px 8px 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .header-titles { min-width: 0; flex: 1; }

    .top-chrome h1 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }

    .top-chrome .subtitle {
      font-size: 0.7rem;
      color: var(--ink-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .chrome-btn {
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .chrome-btn:hover { background: var(--surface-3); }
    .chrome-btn:focus-visible,
    .fab-btn:focus-visible,
    .sheet-icon-btn:focus-visible,
    .day-btn:focus-visible,
    .city-btn:focus-visible,
    .mode-btn:focus-visible,
    .panel-hide-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .chrome-btn.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* —— Map FABs —— */
    .map-fabs {
      position: absolute;
      z-index: var(--z-fab);
      right: calc(10px + var(--sar));
      bottom: calc(var(--day-sheet-h) + var(--sab) + 14px);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
      transition: bottom 0.28s var(--ease-out);
    }

    .fab-btn {
      pointer-events: auto;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }

    .fab-btn.show { display: inline-flex; }
    .fab-btn:hover { border-color: var(--accent); }
    .fab-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* —— Scrim —— */
    .sheet-scrim {
      position: absolute;
      inset: 0;
      z-index: var(--z-scrim);
      background: oklch(0.1 0.02 250 / 0.55);
      border: 0;
      padding: 0;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s var(--ease-out);
    }

    .sheet-scrim.is-on {
      opacity: 1;
      pointer-events: auto;
    }

    /* —— Shared sheet chrome —— */
    .sheet-grab {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 28px;
      padding: 10px 0 4px;
      border: 0;
      background: transparent;
      cursor: grab;
      touch-action: none;
      flex-shrink: 0;
    }

    .sheet-grab:active { cursor: grabbing; }

    .sheet-grab-bar {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-strong);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 14px 10px;
      flex-shrink: 0;
    }

    .badge-panel-title,
    .aux-sheet h3 {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
      line-height: 1.3;
    }

    .sheet-icon-btn,
    .panel-hide-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--ink-muted);
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-icon-btn:hover,
    .panel-hide-btn:hover {
      background: var(--surface-3);
      color: var(--ink);
    }

    /* —— Day sheet (bottom on phone) —— */
    .day-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: var(--z-sheet);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: 0 -6px 20px oklch(0 0 0 / 0.35);
      padding-bottom: var(--sab);
      overflow: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      transition: height 0.28s var(--ease-out), transform 0.28s var(--ease-out);
      height: 42dvh;
      max-height: calc(100% - var(--top-chrome-h) - var(--sat) - 12px);
    }

    .day-sheet[data-state="peek"] {
      height: calc(var(--day-peek-h) + var(--sab));
    }

    .day-sheet[data-state="half"] {
      height: 42dvh;
    }

    .day-sheet[data-state="full"] {
      height: calc(100% - var(--top-chrome-h) - var(--sat) - 12px);
    }

    .day-sheet[data-state="hidden"] {
      transform: translateY(110%);
      pointer-events: none;
    }

    .day-sheet.is-dragging {
      transition: none;
    }

    .day-sheet.is-tucked {
      opacity: 0;
      pointer-events: none;
      transform: translateY(24px);
    }

    .day-sheet[data-state="peek"] .badge-list,
    .day-sheet[data-state="peek"] .offline-banner {
      visibility: hidden;
    }

    /* —— Aux sheets (filter / nav) —— */
    .aux-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: var(--z-aux);
      display: flex;
      flex-direction: column;
      /* leave top band for scrim tap-to-dismiss */
      max-height: min(72dvh, calc(100% - var(--top-chrome-h) - var(--sat) - 48px));
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: 0 -8px 24px oklch(0 0 0 / 0.4);
      padding-bottom: var(--sab);
      overflow: hidden;
      transform: translateY(0);
      transition: transform 0.28s var(--ease-out);
    }

    .aux-sheet.is-hidden {
      transform: translateY(110%);
      pointer-events: none;
      visibility: hidden;
    }

    .aux-sheet-body {
      padding: 0 14px calc(18px + var(--sab));
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      flex: 1 1 0;
      min-height: 0;
      max-height: 100%;
    }

    .filter-section { margin-bottom: 14px; }

    .filter-label {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--ink-faint);
      margin-bottom: 8px;
    }

    .day-filters, .city-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .day-btn, .city-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--ink-muted);
      padding: 10px 14px;
      min-height: 40px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
      user-select: none;
    }

    .day-btn:hover, .city-btn:hover {
      background: var(--surface-3);
      color: var(--ink);
    }

    .day-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .city-btn.active {
      background: oklch(0.55 0.14 300);
      border-color: oklch(0.55 0.14 300);
      color: white;
    }

    .city-btn.all-btn.active,
    .day-btn.all-day.active {
      background: oklch(0.55 0.14 150);
      border-color: oklch(0.55 0.14 150);
      color: white;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.hotel { background: var(--ok); }
    .dot.osaka { background: var(--accent); }
    .dot.tokyo { background: oklch(0.65 0.16 15); }
    .dot.bus { background: oklch(0.65 0.16 300); }

    .sheet-meta {
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--ink-faint);
      line-height: 1.4;
    }

    #appVersion {
      margin-top: 4px;
      font-size: 0.62rem;
      color: oklch(0.45 0.02 250);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    /* —— Search / nav form —— */
    .search-row { margin-bottom: 12px; }

    .search-row label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--ink-faint);
      margin-bottom: 6px;
    }

    .search-row input,
    .search-row select {
      width: 100%;
      padding: 12px 12px;
      min-height: 44px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--ink);
      font-size: 0.9rem;
      outline: none;
    }

    .search-row input:focus,
    .search-row select:focus {
      border-color: var(--accent);
    }

    .search-row input::placeholder { color: var(--ink-faint); }

    .place-search-wrap { position: relative; }

    .place-suggest {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 100%;
      z-index: 20;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 2px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
    }

    .place-suggest.show { display: block; }

    .place-suggest-item {
      padding: 12px 12px;
      min-height: 44px;
      font-size: 0.82rem;
      color: var(--ink);
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      line-height: 1.35;
    }

    .place-suggest-item:last-child { border-bottom: none; }
    .place-suggest-item:hover { background: var(--surface-3); }

    .place-suggest-empty,
    .place-suggest-loading {
      padding: 10px 12px;
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

    .place-picked {
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--ok);
      line-height: 1.3;
      display: none;
    }

    .place-picked.show { display: block; }

    .mode-btns { display: flex; gap: 6px; }

    .mode-btn {
      flex: 1;
      padding: 10px 0;
      min-height: 44px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--ink-muted);
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .mode-btn:hover {
      background: var(--surface-3);
      color: var(--ink);
    }

    .mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .search-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .search-actions button {
      flex: 1;
      padding: 12px 0;
      min-height: 44px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-route { background: var(--accent); color: white; }
    .btn-route:hover { background: var(--accent-hover); }
    .btn-amap { background: oklch(0.62 0.12 220); color: white; }
    .btn-amap:hover { background: oklch(0.56 0.12 220); }
    .btn-clear {
      background: var(--surface-2);
      color: var(--ink-muted);
      border: 1px solid var(--border) !important;
    }
    .btn-clear:hover { background: var(--surface-3); color: var(--ink); }

    .nav-actions button { flex: 1; }

    .route-info {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--ink-muted);
      display: none;
      line-height: 1.4;
    }

    .route-info.show { display: block; }
    .route-info a { color: var(--accent-2); }

    /* —— Day sheet content —— */
    .today-chip {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      background: oklch(0.35 0.08 150);
      color: var(--ok);
      font-size: 0.68rem;
      font-weight: 600;
      vertical-align: middle;
    }

    .offline-banner {
      display: none;
      margin: 0 14px 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--warn-bg);
      border: 1px solid oklch(0.5 0.08 75);
      color: var(--warn-ink);
      font-size: 0.75rem;
      line-height: 1.35;
      flex-shrink: 0;
    }

    .offline-banner.show { display: block; }

    .badge-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      /* flex-basis 0: iOS Safari otherwise grows with content and clips (no scroll) */
      flex: 1 1 0;
      min-height: 0;
      max-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      /* Extra end space so last long tip can scroll fully above home indicator */
      padding: 0 12px calc(28px + var(--sab));
    }

    .tl-seg {
      font-size: 0.72rem;
      color: var(--accent-2);
      padding: 8px 10px;
      margin: 0 2px;
      background: oklch(0.26 0.03 220);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      line-height: 1.45;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .badge-item {
      display: flex;
      flex-direction: column;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      border: 1px solid transparent;
      /* Do not clip wrapped tip / address lines */
      overflow: visible;
    }

    .badge-item:hover,
    .badge-item.is-open {
      background: var(--surface-3);
      border-color: var(--border-strong);
    }

    .badge-item.is-active {
      background: oklch(0.30 0.04 250);
      border-color: var(--accent);
    }

    .badge-item.is-active .badge-name { color: var(--ink); }

    .custom-marker {
      background: transparent !important;
      border: none !important;
    }

    .custom-marker > div {
      transition: transform 0.15s var(--ease-out), box-shadow 0.15s ease;
    }

    .custom-marker.is-active > div {
      transform: scale(1.45);
      box-shadow: 0 0 0 3px var(--accent), 0 2px 10px oklch(0 0 0 / 0.55);
    }

    .badge-item-main {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      min-height: 48px;
    }

    .badge-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .badge-item-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .badge-name {
      font-weight: 600;
      color: var(--ink);
      line-height: 1.35;
      font-size: 0.88rem;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .badge-sub {
      margin-top: 3px;
      font-size: 0.72rem;
      color: var(--ink-muted);
      line-height: 1.45;
      overflow-wrap: anywhere;
      word-break: break-word;
      /* Collapsed row: keep list scannable; full tip lives in .badge-detail */
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
    }

    .badge-item.is-open .badge-sub {
      display: block;
      -webkit-line-clamp: unset;
      line-clamp: unset;
      overflow: visible;
    }

    .badge-detail {
      display: none;
      padding: 0 12px 14px 32px;
      border-top: 1px solid var(--border);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .badge-item.is-open .badge-detail { display: block; }

    .badge-detail p {
      margin: 10px 0 0;
      font-size: 0.78rem;
      color: var(--ink-muted);
      line-height: 1.5;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .badge-detail .tip { color: var(--ink-faint); }

    .badge-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .badge-actions button,
    .badge-actions a.btn-like {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      line-height: 1.2;
      min-height: 44px;
    }

    .badge-actions button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .badge-actions button:hover,
    .badge-actions a.btn-like:hover {
      border-color: var(--accent);
    }

    .badge-actions button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .nav-origin-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .nav-origin-row button {
      font-size: 0.72rem;
      padding: 8px 10px;
      min-height: 36px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink-muted);
      border-radius: 999px;
      cursor: pointer;
    }

    .nav-origin-row button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .empty-today {
      padding: 18px 12px;
      font-size: 0.82rem;
      color: var(--ink-muted);
      line-height: 1.5;
      text-align: center;
    }

    /* —— Unlock —— */
    #unlockGate {
      position: fixed;
      inset: 0;
      z-index: var(--z-unlock);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + var(--sat)) calc(20px + var(--sar)) calc(20px + var(--sab)) calc(20px + var(--sal));
    }

    #unlockGate.is-hidden { display: none; }

    .unlock-card {
      width: min(360px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 18px;
      box-shadow: var(--shadow);
    }

    .unlock-card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .unlock-card p {
      font-size: 0.82rem;
      color: var(--ink-muted);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .unlock-card input {
      width: 100%;
      padding: 12px;
      min-height: 48px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-size: 1rem;
      outline: none;
      margin-bottom: 10px;
    }

    .unlock-card input:focus { border-color: var(--accent); }

    .unlock-card .err {
      display: none;
      color: var(--danger);
      font-size: 0.78rem;
      margin: -4px 0 10px;
    }

    .unlock-card .err.show { display: block; }

    .unlock-card button {
      width: 100%;
      padding: 12px;
      min-height: 48px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .unlock-card button:hover { background: var(--accent-hover); }
    .unlock-card button:disabled { opacity: 0.6; cursor: wait; }

    .unlock-card .hint {
      margin-top: 12px;
      font-size: 0.72rem;
      color: var(--ink-faint);
      line-height: 1.45;
    }

    /* —— Popups —— */
    .leaflet-popup-content-wrapper {
      background: var(--surface);
      color: var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .leaflet-popup-tip { background: var(--surface); }

    .leaflet-popup-content {
      margin: 12px 14px;
      font-size: 0.88rem;
      line-height: 1.45;
      min-width: 180px;
      max-width: min(280px, 70vw);
    }

    .popup-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 3px;
      color: var(--ink);
    }

    .popup-day {
      display: inline-block;
      background: var(--surface-2);
      color: var(--ink-muted);
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 999px;
      margin-bottom: 5px;
    }

    .popup-desc { color: var(--ink-muted); font-size: 0.82rem; }

    .popup-tip {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
      color: var(--ink-faint);
      font-size: 0.75rem;
      line-height: 1.45;
    }

    .popup-mode {
      display: inline-block;
      background: var(--surface-2);
      color: var(--ink);
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .popup-route-line {
      color: var(--ink-muted);
      font-size: 0.82rem;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .popup-route-line strong { color: var(--ink); }

    .popup-seg-label {
      color: var(--accent-2);
      font-size: 0.78rem;
      margin: 6px 0 4px;
      line-height: 1.4;
    }

    .badge-list::-webkit-scrollbar,
    .aux-sheet-body::-webkit-scrollbar { width: 5px; }
    .badge-list::-webkit-scrollbar-track,
    .aux-sheet-body::-webkit-scrollbar-track { background: transparent; }
    .badge-list::-webkit-scrollbar-thumb,
    .aux-sheet-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* —— Desktop: docked day panel, roomy map —— */
    @media (min-width: 900px) {
      :root { --day-sheet-h: 0px; }

      .top-chrome {
        pointer-events: none;
      }

      .top-bar {
        max-width: calc(100% - min(380px, 36vw) - 36px);
      }

      .map-fabs {
        right: calc(min(380px, 36vw) + 24px);
        bottom: 24px;
      }

      .leaflet-bottom.leaflet-right {
        bottom: 24px;
        right: calc(min(380px, 36vw) + 24px);
      }

      .leaflet-top.leaflet-left {
        top: calc(var(--top-chrome-h) + 16px);
      }

      .day-sheet {
        left: auto;
        right: 14px;
        top: 14px;
        bottom: 14px;
        width: min(380px, 36vw);
        height: auto !important;
        max-height: none;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        padding-bottom: 0;
        box-shadow: var(--shadow);
        transform: none !important;
        pointer-events: auto !important;
      }

      .day-sheet .sheet-grab { display: none; }

      .day-sheet[data-state="hidden"] {
        display: none;
      }

      .aux-sheet {
        left: 14px;
        right: auto;
        top: 14px;
        bottom: auto;
        width: min(360px, 34vw);
        max-height: calc(100% - 28px);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        padding-bottom: 0;
        box-shadow: var(--shadow);
      }

      .aux-sheet.is-hidden {
        transform: none;
        display: none;
        visibility: visible;
        pointer-events: auto;
      }

      .sheet-scrim { display: none !important; }

      .sheet-grab { cursor: default; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="unlockGate" aria-modal="true" role="dialog" aria-labelledby="unlockTitle">
    <div class="unlock-card">
      <h2 id="unlockTitle">解锁行程</h2>
      <p>口令仅在本机解密，用于查看今日安排与地图。断网时仍可读已缓存内容。</p>
      <input type="password" id="unlockPass" placeholder="输入行程口令" autocomplete="current-password" />
      <div class="err" id="unlockErr">口令错误或数据损坏</div>
      <button type="button" id="unlockBtn">进入行程</button>
      <div class="hint">链接可公开；行程密文需口令。请勿在公开场合分享口令。</div>
    </div>
  </div>

  <div id="mapShell">
    <div id="map"></div>

    <header class="top-chrome" id="appHeader">
      <div class="top-bar">
        <div class="header-titles">
          <h1 id="pageTitle">大阪 × 东京 行程地图</h1>
          <div class="subtitle" id="pageSubtitle">加载行程中…</div>
        </div>
        <div class="top-actions">
          <button type="button" class="chrome-btn" id="restoreSearch" aria-expanded="false" aria-controls="searchPanel">导航</button>
          <button type="button" class="chrome-btn" id="filterOpenBtn" aria-expanded="false" aria-controls="filterSheet">筛选</button>
        </div>
      </div>
    </header>

    <div class="map-fabs" id="mapFabs">
      <button type="button" class="fab-btn primary" id="restoreBadges">行程</button>
    </div>

    <button type="button" class="sheet-scrim" id="sheetScrim" aria-label="关闭面板" tabindex="-1"></button>

    <aside class="aux-sheet is-hidden" id="filterSheet" aria-hidden="true" aria-labelledby="filterTitle">
      <button type="button" class="sheet-grab" id="filterGrab" aria-label="关闭筛选">
        <span class="sheet-grab-bar" aria-hidden="true"></span>
      </button>
      <div class="panel-head">
        <h3 id="filterTitle">筛选</h3>
        <button type="button" class="panel-hide-btn" id="filterCloseBtn" title="关闭" aria-label="关闭筛选">✕</button>
      </div>
      <div class="aux-sheet-body">
        <div class="filter-section">
          <div class="filter-label">城市</div>
          <div class="city-filters">
            <button class="city-btn all-btn active" data-city="all">全部</button>
            <button class="city-btn" data-city="osaka">只看大阪</button>
            <button class="city-btn" data-city="tokyo">只看东京</button>
          </div>
        </div>

        <div class="filter-section">
          <div class="filter-label">日期（可多选）</div>
          <div class="day-filters" id="dayFilters">
            <button class="day-btn all-day active" data-day="all">全部日期</button>
          </div>
        </div>

        <div class="legend">
          <div class="legend-item"><span class="dot hotel"></span> 酒店</div>
          <div class="legend-item"><span class="dot osaka"></span> 大阪</div>
          <div class="legend-item"><span class="dot tokyo"></span> 东京</div>
          <div class="legend-item"><span class="dot bus"></span> 夜巴</div>
        </div>

        <div class="sheet-meta">
          <div id="pageFooter">加载行程…</div>
          <div id="appVersion"></div>
        </div>
      </div>
    </aside>

    <aside class="aux-sheet is-hidden" id="searchPanel" aria-hidden="true" aria-labelledby="navTitle">
      <button type="button" class="sheet-grab" id="navGrab" aria-label="关闭导航">
        <span class="sheet-grab-bar" aria-hidden="true"></span>
      </button>
      <div class="panel-head">
        <h3 id="navTitle">导航</h3>
        <button type="button" class="panel-hide-btn" id="hideSearch" title="关闭" aria-label="关闭导航">✕</button>
      </div>
      <div class="aux-sheet-body">
        <div class="search-row" id="startPicker">
          <label for="startSearchInput">起点（搜索选择）</label>
          <div class="place-search-wrap" id="startSearchWrap">
            <input type="text" id="startSearchInput" placeholder="搜索地点，如：酒店 / 五反田 / 心斋桥" autocomplete="off" />
            <div class="place-suggest" id="startSuggest"></div>
          </div>
          <div class="place-picked" id="startPicked"></div>
        </div>

        <div class="search-row" id="targetPicker">
          <label for="targetSearchInput">终点（搜索选择）</label>
          <div class="place-search-wrap" id="targetSearchWrap">
            <input type="text" id="targetSearchInput" placeholder="搜索地点，如：银座 / 浅草寺 / USJ" autocomplete="off" />
            <div class="place-suggest" id="targetSuggest"></div>
          </div>
          <div class="place-picked" id="targetPicked"></div>
        </div>

        <div class="search-row">
          <label>出行方式（交给外部地图）</label>
          <div class="mode-btns" id="modeBtns">
            <button type="button" class="mode-btn active" data-mode="transit">🚇 公交</button>
            <button type="button" class="mode-btn" data-mode="walking">🚶 步行</button>
            <button type="button" class="mode-btn" data-mode="driving">🚗 驾车</button>
          </div>
        </div>

        <div class="search-actions nav-actions">
          <button type="button" class="btn-route" id="btnGoogleNav">Google 地图</button>
          <button type="button" class="btn-amap" id="btnAmapNav">高德地图</button>
        </div>
        <div class="search-actions" style="margin-top:8px">
          <button type="button" class="btn-clear" id="btnClearRoute">清除</button>
        </div>

        <div class="route-info" id="routeInfo"></div>
      </div>
    </aside>

    <aside class="day-sheet" id="badgePanel" data-state="half" aria-labelledby="timelineTitle">
      <button type="button" class="sheet-grab" id="sheetGrab" aria-label="拖动或切换行程面板高度">
        <span class="sheet-grab-bar" aria-hidden="true"></span>
      </button>
      <div class="panel-head">
        <div class="badge-panel-title">
          <span id="timelineTitle">今日行程</span>
          <span class="today-chip" id="todayChip" style="display:none">今天</span>
          <span id="badgeCount"></span>
        </div>
        <button type="button" class="sheet-icon-btn" id="hideBadges" title="收起" aria-label="收起行程面板">▾</button>
      </div>
      <div class="offline-banner" id="offlineBanner">离线模式：显示已缓存行程。地图/搜索可能不可用。</div>
      <div class="badge-list" id="badgeList"></div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 发版时改这里；底栏会显示，用来确认手机跑的是哪一版
    const APP_VERSION = '2026.08.28-2';
    const SW_CACHE_LABEL = 'v14';

    function isStandalonePwa() {
      return window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
    }

    /** iOS PWA/WebClip 偶发 env(safe-area)=0 但内容仍顶到状态栏：测一次并写 CSS 变量兜底 */
    function applySafeAreaFallback() {
      const probe = document.createElement('div');
      probe.setAttribute('aria-hidden', 'true');
      probe.style.cssText =
        'position:fixed;visibility:hidden;pointer-events:none;' +
        'padding-top:env(safe-area-inset-top,0px);' +
        'padding-bottom:env(safe-area-inset-bottom,0px);';
      document.documentElement.appendChild(probe);
      const cs = getComputedStyle(probe);
      const sat = parseFloat(cs.paddingTop) || 0;
      const sab = parseFloat(cs.paddingBottom) || 0;
      probe.remove();
      const root = document.documentElement.style;
      if (sat > 0) root.setProperty('--sat', sat + 'px');
      else if (isStandalonePwa()) root.setProperty('--sat', '59px'); // Dynamic Island 常见高度
      if (sab > 0) root.setProperty('--sab', sab + 'px');
      else if (isStandalonePwa()) root.setProperty('--sab', '34px'); // home indicator
    }
    applySafeAreaFallback();

    function paintAppVersion(extra) {
      const el = document.getElementById('appVersion');
      if (!el) return;
      const bits = ['app ' + APP_VERSION, 'sw ' + SW_CACHE_LABEL];
      if (extra) bits.push(extra);
      if (isStandalonePwa()) bits.push('pwa');
      el.textContent = bits.join(' · ');
    }
    paintAppVersion();

    const map = L.map('map').setView([34.95, 136.9], 8);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 19
    }).addTo(map);

    // 浮层面板在地图之上：阻止滚轮/点击穿透到 Leaflet
    ['searchPanel', 'badgePanel', 'filterSheet'].forEach((id) => {
      const el = document.getElementById(id);
      if (!el) return;
      L.DomEvent.disableScrollPropagation(el);
      L.DomEvent.disableClickPropagation(el);
    });
    // 列表只要隔滚动，不要隔 click（否则展开详情会偶发失效）
    const badgeListEl = document.getElementById('badgeList');
    if (badgeListEl) L.DomEvent.disableScrollPropagation(badgeListEl);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((r) => r.update());
      }).catch(() => {});
    }

    const DAY_STATES = ['peek', 'half', 'full'];
    const mqCompact = window.matchMedia('(max-width: 899px)');

    function isCompactLayout() {
      return mqCompact.matches;
    }

    function invalidateMapSoon() {
      setTimeout(() => { try { map.invalidateSize(); } catch (_) {} }, 60);
    }

    function syncDayFab() {
      const sheet = document.getElementById('badgePanel');
      const chip = document.getElementById('restoreBadges');
      if (!sheet || !chip) return;
      const hidden = sheet.getAttribute('data-state') === 'hidden';
      chip.classList.toggle('show', hidden);
    }

    function syncNavFab() {
      const panel = document.getElementById('searchPanel');
      const chip = document.getElementById('restoreSearch');
      if (!panel || !chip) return;
      const open = !panel.classList.contains('is-hidden');
      chip.classList.toggle('is-active', open);
      chip.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function syncScrim() {
      const scrim = document.getElementById('sheetScrim');
      const daySheet = document.getElementById('badgePanel');
      const filterOpen = !document.getElementById('filterSheet')?.classList.contains('is-hidden');
      const navOpen = !document.getElementById('searchPanel')?.classList.contains('is-hidden');
      const on = isCompactLayout() && (filterOpen || navOpen);
      if (scrim) {
        scrim.classList.toggle('is-on', on);
        scrim.tabIndex = on ? 0 : -1;
      }
      // Phone: tuck day sheet while filter/nav is open so panels don't stack
      if (daySheet) {
        daySheet.classList.toggle('is-tucked', on);
      }
    }

    function syncFilterBtn() {
      const btn = document.getElementById('filterOpenBtn');
      const sheet = document.getElementById('filterSheet');
      if (!btn || !sheet) return;
      const open = !sheet.classList.contains('is-hidden');
      btn.classList.toggle('is-active', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function updateDaySheetOffset() {
      const sheet = document.getElementById('badgePanel');
      const root = document.documentElement;
      if (!sheet || !isCompactLayout()) {
        root.style.setProperty('--day-sheet-h', '0px');
        return;
      }
      const state = sheet.getAttribute('data-state') || 'half';
      if (state === 'hidden') {
        root.style.setProperty('--day-sheet-h', '0px');
        return;
      }
      // Read after layout; fall back to CSS state heights
      requestAnimationFrame(() => {
        const h = sheet.getBoundingClientRect().height;
        root.style.setProperty('--day-sheet-h', Math.max(0, Math.round(h)) + 'px');
      });
    }

    function setDaySheetState(state, persist = true) {
      const sheet = document.getElementById('badgePanel');
      const hideBtn = document.getElementById('hideBadges');
      if (!sheet) return;
      const next = DAY_STATES.includes(state) || state === 'hidden' ? state : 'half';
      sheet.setAttribute('data-state', next);
      if (hideBtn) {
        if (next === 'full') {
          hideBtn.textContent = '▾';
          hideBtn.title = '半屏';
          hideBtn.setAttribute('aria-label', '收起到半屏');
        } else if (next === 'half') {
          hideBtn.textContent = '▾';
          hideBtn.title = '收起';
          hideBtn.setAttribute('aria-label', '收起到预览');
        } else if (next === 'peek') {
          hideBtn.textContent = '▴';
          hideBtn.title = '展开';
          hideBtn.setAttribute('aria-label', '展开行程');
        } else {
          hideBtn.textContent = '▴';
          hideBtn.title = '展开';
          hideBtn.setAttribute('aria-label', '展开行程');
        }
      }
      if (persist) {
        try { localStorage.setItem('japan-map:daySheet', next); } catch (_) {}
      }
      syncDayFab();
      updateDaySheetOffset();
      invalidateMapSoon();
    }

    function ensureDaySheetVisible(minState = 'half') {
      const sheet = document.getElementById('badgePanel');
      if (!sheet) return;
      const cur = sheet.getAttribute('data-state') || 'half';
      const rank = { hidden: 0, peek: 1, half: 2, full: 3 };
      if ((rank[cur] || 0) < (rank[minState] || 2)) {
        setDaySheetState(minState);
      }
    }

    /** 兼容旧调用：行程面板开/关 */
    function setPanelVisible(panelId, chipId, visible) {
      if (panelId === 'badgePanel') {
        if (visible) ensureDaySheetVisible(isCompactLayout() ? 'half' : 'half');
        else setDaySheetState(isCompactLayout() ? 'hidden' : 'hidden');
        return;
      }
      if (panelId === 'searchPanel') {
        setAuxSheet('searchPanel', visible);
      }
    }

    function setAuxSheet(id, open) {
      const panel = document.getElementById(id);
      if (!panel) return;
      panel.classList.toggle('is-hidden', !open);
      panel.setAttribute('aria-hidden', open ? 'false' : 'true');
      if (id === 'searchPanel') {
        try { localStorage.setItem('japan-map:searchPanel', open ? '1' : '0'); } catch (_) {}
        syncNavFab();
      }
      if (id === 'filterSheet') syncFilterBtn();
      syncScrim();
      invalidateMapSoon();
    }

    function closeAuxSheets() {
      setAuxSheet('searchPanel', false);
      setAuxSheet('filterSheet', false);
    }

    // Day sheet drag (phone)
    (function bindDaySheetDrag() {
      const grab = document.getElementById('sheetGrab');
      const sheet = document.getElementById('badgePanel');
      if (!grab || !sheet) return;

      let dragging = false;
      let startY = 0;
      let startH = 0;

      function heightForState(state) {
        const shell = document.getElementById('mapShell');
        const shellH = shell ? shell.clientHeight : window.innerHeight;
        const peek = 72;
        if (state === 'peek') return peek;
        if (state === 'full') return Math.max(peek, shellH - 64);
        return Math.round(shellH * 0.42);
      }

      function stateForHeight(h) {
        const peek = heightForState('peek');
        const half = heightForState('half');
        const full = heightForState('full');
        const midPH = (peek + half) / 2;
        const midHF = (half + full) / 2;
        if (h < midPH - 20) return h < peek * 0.55 ? 'hidden' : 'peek';
        if (h < midHF) return 'half';
        return 'full';
      }

      function onPointerDown(e) {
        if (!isCompactLayout()) return;
        dragging = true;
        startY = e.clientY;
        startH = sheet.getBoundingClientRect().height;
        sheet.classList.add('is-dragging');
        try { grab.setPointerCapture(e.pointerId); } catch (_) {}
      }

      function onPointerMove(e) {
        if (!dragging) return;
        const dy = startY - e.clientY;
        const shell = document.getElementById('mapShell');
        const maxH = shell ? shell.clientHeight - 48 : window.innerHeight;
        const next = Math.min(maxH, Math.max(48, startH + dy));
        sheet.style.height = next + 'px';
      }

      function onPointerUp(e) {
        if (!dragging) return;
        dragging = false;
        sheet.classList.remove('is-dragging');
        const h = sheet.getBoundingClientRect().height;
        sheet.style.height = '';
        const next = stateForHeight(h);
        setDaySheetState(next);
        try { grab.releasePointerCapture(e.pointerId); } catch (_) {}
      }

      grab.addEventListener('pointerdown', onPointerDown);
      grab.addEventListener('pointermove', onPointerMove);
      grab.addEventListener('pointerup', onPointerUp);
      grab.addEventListener('pointercancel', onPointerUp);

      grab.addEventListener('click', (e) => {
        // Ignore click that ends a drag with movement
        if (Math.abs((e.clientY || 0) - startY) > 8) return;
      });
    })();

    /** 解析 itinerary.md → 结构化行程数据 */
    function parseItineraryMd(md) {
      const lines = md.replace(/\r\n/g, '\n').split('\n');
      const sections = {};
      let cur = null;
      let buf = [];

      function flush() {
        if (cur) sections[cur] = buf.join('\n').trim();
        buf = [];
      }

      for (const line of lines) {
        const m = line.match(/^##\s+(.+?)\s*$/);
        if (m) {
          flush();
          cur = m[1].trim();
          continue;
        }
        if (cur) buf.push(line);
      }
      flush();

      // Meta
      const meta = {};
      (sections['Meta'] || '').split('\n').forEach(line => {
        const mm = line.match(/^-\s*(\w+)\s*:\s*(.*)$/);
        if (mm) meta[mm[1]] = mm[2].trim();
      });

      // Days table
      const days = [];
      (sections['Days'] || '').split('\n').forEach(line => {
        if (!line.startsWith('|')) return;
        if (/^\|\s*-+/.test(line) || /\|?\s*id\s*\|/i.test(line)) return;
        const cells = line.split('|').map(c => c.trim()).filter(Boolean);
        if (cells.length >= 2 && cells[0] !== 'id') {
          days.push({ id: cells[0], label: cells[1] });
        }
      });

      // Points
      const pts = [];
      const pointsBody = sections['Points'] || '';
      const pointBlocks = pointsBody.split(/^###\s+/m).filter(Boolean);
      pointBlocks.forEach(block => {
        const blines = block.split('\n');
        const id = blines[0].trim();
        if (!id) return;
        const p = { id, tip: '' };
        blines.slice(1).forEach(line => {
          const fm = line.match(/^-\s*(\w+)\s*:\s*(.*)$/);
          if (!fm) return;
          const key = fm[1];
          const val = fm[2].trim();
          if (key === 'lat' || key === 'lng') p[key] = parseFloat(val);
          else if (key === 'days') p.days = val.split(',').map(s => s.trim()).filter(Boolean);
          else p[key] = val;
        });
        if (p.name && !Number.isNaN(p.lat) && !Number.isNaN(p.lng)) pts.push(p);
      });

      // Routes
      const routeOrders = {};
      const routeSegments = {};
      const routesBody = sections['Routes'] || '';
      let routeDay = null;
      routesBody.split('\n').forEach(line => {
        const dm = line.match(/^###\s+(\S+)/);
        if (dm) {
          routeDay = dm[1].trim();
          routeOrders[routeDay] = [];
          routeSegments[routeDay] = [];
          return;
        }
        if (!routeDay) return;
        // from --mode--> to | label
        const rm = line.match(/^(\S+)\s+--(\w+)-->\s+(\S+)(?:\s*\|\s*(.*))?$/);
        if (!rm) return;
        const from = rm[1], mode = rm[2], to = rm[3], label = (rm[4] || '').trim();
        const segs = routeSegments[routeDay];
        const order = routeOrders[routeDay];
        if (!order.includes(from)) order.push(from);
        if (!order.includes(to)) order.push(to);
        segs.push({ from, to, mode, label });
      });

      // NightBus
      const night = [];
      const nightBody = sections['NightBus'] || '';
      let bus = null;
      nightBody.split('\n').forEach(line => {
        const bm = line.match(/^###\s+(.+)$/);
        if (bm) {
          if (bus && bus.path) night.push(bus);
          bus = { id: bm[1].trim(), color: '#a855f7', popup: bm[1].trim(), path: [] };
          return;
        }
        if (!bus) return;
        const fm = line.match(/^-\s*(\w+)\s*:\s*(.*)$/);
        if (!fm) return;
        if (fm[1] === 'popup') bus.popup = fm[2].trim();
        else if (fm[1] === 'color') bus.color = fm[2].trim();
        else if (fm[1] === 'path') {
          bus.path = fm[2].split('|').map(pair => {
            const [lat, lng] = pair.trim().split(',').map(Number);
            return [lat, lng];
          }).filter(c => !Number.isNaN(c[0]) && !Number.isNaN(c[1]));
        }
      });
      if (bus && bus.path && bus.path.length) night.push(bus);

      return { meta, days, points: pts, dayRouteOrders: routeOrders, dayRouteSegments: routeSegments, nightBuses: night };
    }

    /** 日本时区「旅行日」：4:00 前仍算昨天。返回如 9-5 */
    function getJapanTravelDayId(date = new Date()) {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: 'numeric',
        day: 'numeric',
        hour: 'numeric',
        hourCycle: 'h23'
      }).formatToParts(date);
      const get = t => Number(parts.find(p => p.type === t).value);
      let y = get('year'), m = get('month'), d = get('day'), h = get('hour');
      if (h < 4) {
        const utc = new Date(Date.UTC(y, m - 1, d));
        utc.setUTCDate(utc.getUTCDate() - 1);
        y = utc.getUTCFullYear();
        m = utc.getUTCMonth() + 1;
        d = utc.getUTCDate();
      }
      return `${m}-${d}`;
    }

    function dayIdToSortKey(id) {
      const [m, d] = id.split('-').map(Number);
      return (m || 0) * 100 + (d || 0);
    }

    function resolveDefaultDayId() {
      const todayId = getJapanTravelDayId();
      if (itineraryDays.some(d => d.id === todayId)) return todayId;
      // 行程未开始：跳到第一天；已结束：最后一天
      if (!itineraryDays.length) return 'all';
      const todayKey = dayIdToSortKey(todayId);
      const first = itineraryDays[0].id;
      const last = itineraryDays[itineraryDays.length - 1].id;
      if (todayKey < dayIdToSortKey(first)) return first;
      if (todayKey > dayIdToSortKey(last)) return last;
      // 夹在中间但无没有（如 9-3 有）：找最近的未来日
      const upcoming = itineraryDays.find(d => dayIdToSortKey(d.id) >= todayKey);
      return upcoming ? upcoming.id : last;
    }

    function findHotelForPlace(place) {
      if (!place) {
        return points.find(p => p.id === 'hotel-tokyo') || points.find(p => p.id === 'hotel');
      }
      if (place.city === 'tokyo') {
        return points.find(p => p.id === 'hotel-tokyo') || points.find(p => p.type === 'hotel' && p.city === 'tokyo');
      }
      return points.find(p => p.id === 'hotel') || points.find(p => p.type === 'hotel' && p.city === 'osaka');
    }

    function openNavToPlace(dest, originMode) {
      const mode = originMode || navOriginMode;
      const go = (origin) => {
        const url = googleMapsDirUrl(origin, dest, 'transit');
        const amap = amapNavUrl(origin, dest, 'transit');
        window.open(url, '_blank', 'noopener');
        const infoEl = document.getElementById('routeInfo');
        if (infoEl) {
          infoEl.className = 'route-info show';
          infoEl.innerHTML = `
            <strong>导航</strong><br>
            ${(origin.shortName || origin.name)} → ${(dest.shortName || dest.name)}<br>
            <a href="${url}" target="_blank" rel="noopener">Google 地图</a>
            · <a href="${amap}" target="_blank" rel="noopener">高德地图</a>
          `;
        }
      };

      if (mode === 'hotel') {
        const h = findHotelForPlace(dest);
        if (!h) { alert('未找到对应酒店'); return; }
        go({ lat: h.lat, lng: h.lng, name: h.name, shortName: h.name });
        return;
      }
      if (mode === 'custom') {
        setAuxSheet('filterSheet', false);
        setAuxSheet('searchPanel', true);
        customTarget = { lat: dest.lat, lng: dest.lng, name: dest.name, shortName: dest.name };
        document.getElementById('targetSearchInput').value = dest.name;
        document.getElementById('targetPicked').textContent = '✓ 已选：' + dest.name;
        document.getElementById('targetPicked').className = 'place-picked show';
        document.getElementById('startSearchInput').focus();
        alert('请搜索并选择起点，再点 Google / 高德');
        return;
      }
      // me
      if (!navigator.geolocation) {
        alert('无法获取定位，请改用「从酒店」或「自选」');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          go({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            name: '我的位置',
            shortName: '我的位置'
          });
        },
        () => alert('定位失败，请允许定位权限，或改用「从酒店」'),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
      );
    }

    function copyText(text) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          /* ok */
        }).catch(() => {
          window.prompt('复制以下内容', text);
        });
      } else {

    function buildDayTimeline(dayId) {
      const dayPoints = points.filter(p => p.days && p.days.includes(dayId));
      const order = dayRouteOrders[dayId];
      let ordered = [];
      if (order && order.length) {
        order.forEach(id => {
          const p = dayPoints.find(x => x.id === id) || points.find(x => x.id === id);
          if (p && !ordered.some(o => o.id === p.id)) ordered.push(p);
        });
        dayPoints.forEach(p => {
          if (!ordered.some(o => o.id === p.id)) ordered.push(p);
        });
      } else {
        ordered = dayPoints.slice();
      }
      const segs = dayRouteSegments[dayId] || [];
      return { ordered, segs };
    }

      // 当日行程真实路网线（异步 OSRM；短步行已防绕路）
      if (!isOffline) {

      } else {
        // 离线：用直线示意当日顺序
        const singleDay = selectedDays.size === 1 && !selectedDays.has('all')

            .map(id => visiblePoints.find(p => p.id === id))

          if (pts.length >= 2) {
            currentLines.push(L.polyline(pts.map(p => [p.lat, p.lng]), {

          }).addTo(map).bindPopup(nb.popup || nb.id));

      if (visiblePoints.length > 0 && !routeLine && !skipAutoFit) {

        map.fitBounds(bounds, { padding: [60, 60], maxZoom: 12 });

    function haversineMeters(a, b) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const lat1 = toRad(a.lat);
      const lat2 = toRad(b.lat);
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(x));
    }

    async function fetchOsrmCoords(from, to, profile = 'foot') {
      const key = `v2:${profile}:${from.lat.toFixed(5)},${from.lng.toFixed(5)}>${to.lat.toFixed(5)},${to.lng.toFixed(5)}`;
      if (osrmCache.has(key)) return osrmCache.get(key);

      const straight = haversineMeters(from, to);
      const fallback = [[from.lat, from.lng], [to.lat, to.lng]];

      // 短距离步行：公共 OSRM foot 在日本常离谱绕路（如 550m 算成 16km），直接用直线示意
      if (profile === 'foot' && straight < 1500) {
        osrmCache.set(key, fallback);
        return fallback;
      }

      const url = `https://router.project-osrm.org/route/v1/${profile}/${from.lng},${from.lat};${to.lng},${to.lat}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.code === 'Ok' && data.routes && data.routes[0]) {
          const route = data.routes[0];
          // 若 OSRM 比直线绕超过 2.5 倍，视为异常，改用直线
          if (profile === 'foot' && straight > 0 && route.distance > straight * 2.5) {
            osrmCache.set(key, fallback);
            return fallback;
          }
          const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
          osrmCache.set(key, coords);
          return coords;
        }
      } catch (err) {
        console.error('OSRM day route failed', err);
      }
      osrmCache.set(key, fallback);
      return fallback;
    }

    async function drawDayRoutes(visiblePoints) {
      const gen = ++dayRouteGen;
      const byId = Object.fromEntries(visiblePoints.map(p => [p.id, p]));

      const daysForRoute = selectedDays.has('all')
        ? Object.keys(dayRouteSegments)
        : [...selectedDays];

      for (const day of daysForRoute) {
        const segments = dayRouteSegments[day];
        if (!segments) continue;

        for (const seg of segments) {
          const a = byId[seg.from];
          const b = byId[seg.to];
          if (!a || !b) continue;

          let latlngs;
          if (seg.mode === 'foot') {
            latlngs = await fetchOsrmCoords(a, b, 'foot');
          } else {
            // 巴士/电车/缆车：示意虚线（不假装成步行路网）
            latlngs = [[a.lat, a.lng], [b.lat, b.lng]];
          }

          if (gen !== dayRouteGen) return; // 筛选已变，丢弃过期结果

          const style = SEGMENT_STYLE[seg.mode] || SEGMENT_STYLE.foot;
          const popupHtml = buildSegmentPopup(day, seg, a, b);
          const popupOpts = { maxWidth: 300, className: 'seg-popup' };

          // 透明加宽命中层：手机更容易点到虚线
          const hitLine = L.polyline(latlngs, {
            color: style.color,
            weight: 18,
            opacity: 0,
            interactive: true
          }).addTo(map);

          const line = L.polyline(latlngs, {
            color: style.color,
            weight: style.weight,
            opacity: style.opacity,
            dashArray: style.dashArray || undefined,
            interactive: true
          }).addTo(map);

          hitLine.bindPopup(popupHtml, popupOpts);
          line.bindPopup(popupHtml, popupOpts);

          hitLine.on('click', function(e) {
            L.DomEvent.stopPropagation(e);
            this.openPopup(e.latlng);
          });
          line.on('click', function(e) {
            L.DomEvent.stopPropagation(e);
            this.openPopup(e.latlng);
          });

          currentLines.push(hitLine, line);
        }
      }
    }

    // 搜索地点：行程锚点优先 + Nominatim
    async function searchPlaces(query) {
      const q = query.trim().toLowerCase();
      const local = points
        .filter(p =>
          (p.name && p.name.toLowerCase().includes(q)) ||
          (p.desc && p.desc.toLowerCase().includes(q)) ||
          (p.dayLabel && p.dayLabel.toLowerCase().includes(q))
        )
        .slice(0, 8)
        .map(p => ({
          lat: p.lat,
          lng: p.lng,
          name: p.name,
          shortName: p.name,
          fromItinerary: true
        }));

      let remote = [];
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=6&countrycodes=jp&addressdetails=0`;
        const res = await fetch(url, {
          headers: {
            'Accept-Language': 'zh-CN,ja,en',
            'Accept': 'application/json'
          }
        });
        const data = await res.json();
        if (Array.isArray(data)) {
          remote = data.map(item => {
            const full = item.display_name || '';
            const shortName = full.split(',').slice(0, 3).join(',').trim();
            return {
              lat: parseFloat(item.lat),
              lng: parseFloat(item.lon),
              name: full,
              shortName,
              fromItinerary: false
            };
          });
        }
      } catch (err) {
        console.error(err);
      }

      // 合并去重（按坐标粗略）
      const seen = new Set();
      const out = [];
      [...local, ...remote].forEach(r => {
        const k = `${r.lat.toFixed(4)},${r.lng.toFixed(4)}`;
        if (seen.has(k)) return;
        seen.add(k);
        out.push(r);
      });
      return out;
    }

    function modeLabel(mode) {
      if (mode === 'driving') return '驾车';
      if (mode === 'walking') return '步行';
      return '公交';
    }

    function googleMapsDirUrl(from, to, mode) {
      const travel =
        mode === 'driving' ? 'driving' :
        mode === 'walking' ? 'walking' : 'transit';
      const origin = `${from.lat},${from.lng}`;
      const dest = `${to.lat},${to.lng}`;
      return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}&travelmode=${travel}`;
    }

    // 高德 URI：WGS84 坐标；mode: car / bus / walk
    function amapNavUrl(from, to, mode) {
      const amode =
        mode === 'driving' ? 'car' :
        mode === 'walking' ? 'walk' : 'bus';
      const fromName = encodeURIComponent(from.shortName || from.name || '起点');
      const toName = encodeURIComponent(to.shortName || to.name || '终点');
      // from/to: lng,lat,name
      return `https://uri.amap.com/navigation?from=${from.lng},${from.lat},${fromName}&to=${to.lng},${to.lat},${toName}&mode=${amode}&coordinate=wgs84&callnative=1`;
    }

    function clearRouteLayers() {
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
      if (targetMarker) { map.removeLayer(targetMarker); targetMarker = null; }
    }

    function resetSearchField(inputId, suggestId, pickedId, setCustom) {
      const inputEl = document.getElementById(inputId);
      const suggestEl = document.getElementById(suggestId);
      const pickedEl = document.getElementById(pickedId);
      inputEl.value = '';
      suggestEl.className = 'place-suggest';
      suggestEl.innerHTML = '';
      pickedEl.className = 'place-picked';
      pickedEl.textContent = '';
      setCustom(null);

    function requirePickedPlaces() {
      if (!customStart) {
        alert('请搜索并选择起点');
        return null;
      }
      if (!customTarget) {
        alert('请搜索并选择终点');
        return null;
      }
      if (
        Math.abs(customStart.lat - customTarget.lat) < 1e-5 &&
        Math.abs(customStart.lng - customTarget.lng) < 1e-5
      ) {
        alert('起点和终点不能相同');
        return null;
      }
      return { start: customStart, target: customTarget };
    }

    function openExternalNav(provider) {
      const picked = requirePickedPlaces();
      if (!picked) return;
      const { start, target } = picked;
      const infoEl = document.getElementById('routeInfo');

      clearRouteLayers();
      searchMarker = L.marker([start.lat, start.lng], { icon: searchIcon })
        .addTo(map)
        .bindPopup(`<b>起点</b><br>${start.shortName || start.name}`);
      targetMarker = L.marker([target.lat, target.lng], { icon: createIcon('#22d3ee', 18) })
        .addTo(map)
        .bindPopup(`<b>终点</b><br>${target.shortName || target.name}`);
      map.fitBounds(L.latLngBounds(
        [start.lat, start.lng],
        [target.lat, target.lng]
      ), { padding: [50, 50], maxZoom: 15 });

      const url = provider === 'amap'
        ? amapNavUrl(start, target, routeMode)
        : googleMapsDirUrl(start, target, routeMode);

      const appName = provider === 'amap' ? '高德地图' : 'Google 地图';
      infoEl.className = 'route-info show';
      infoEl.innerHTML = `
        <strong>已选择 ${modeLabel(routeMode)}</strong><br>
        ${start.shortName || start.name} → ${target.shortName || target.name}<br>
        <a href="${url}" target="_blank" rel="noopener">在 ${appName} 打开导航 →</a>
      `;
      window.open(url, '_blank', 'noopener');
    }

    document.getElementById('btnGoogleNav').addEventListener('click', () => openExternalNav('google'));
    document.getElementById('btnAmapNav').addEventListener('click', () => openExternalNav('amap'));

    document.getElementById('btnClearRoute').addEventListener('click', () => {
      clearRouteLayers();
      document.getElementById('routeInfo').className = 'route-info';
      document.getElementById('routeInfo').textContent = '';
      resetSearchField('startSearchInput', 'startSuggest', 'startPicked', (v) => { customStart = v; });
      resetSearchField('targetSearchInput', 'targetSuggest', 'targetPicked', (v) => { customTarget = v; });
    });

    // 筛选事件
    document.querySelectorAll('.city-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentCity = this.getAttribute('data-city');
        render();
      });
    });

    // 日期按钮：事件委托（按钮由 MD 动态生成）
    document.getElementById('dayFilters').addEventListener('click', function(e) {
      const btn = e.target.closest('.day-btn');
      if (!btn) return;
      const day = btn.getAttribute('data-day');

      if (day === 'all') {
        selectedDays.clear();
        selectedDays.add('all');
        this.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      } else {
        if (selectedDays.has('all')) {
          selectedDays.delete('all');
          const allBtn = this.querySelector('.day-btn.all-day');
          if (allBtn) allBtn.classList.remove('active');
        }

        if (selectedDays.has(day)) {
          selectedDays.delete(day);
          btn.classList.remove('active');
        } else {
          selectedDays.add(day);
          btn.classList.add('active');
        }

        if (selectedDays.size === 0) {
          selectedDays.add('all');
          const allBtn = this.querySelector('.day-btn.all-day');
          if (allBtn) allBtn.classList.add('active');
        }
      }
      render();
    });

    function updateOnlineState() {
      isOffline = !navigator.onLine;
      const banner = document.getElementById('offlineBanner');
      if (banner) banner.classList.toggle('show', isOffline);
    }
    window.addEventListener('online', () => { updateOnlineState(); });
    window.addEventListener('offline', () => { updateOnlineState(); });

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function deriveAesKey(passphrase, salt, iterations) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        'raw',
        enc.encode(passphrase),
        'PBKDF2',
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    async function decryptItineraryPayload(payload, passphrase) {
      if (!payload || payload.v !== 1 || !payload.ct) {
        throw new Error('加密包格式无效');
      }
      const salt = b64ToBytes(payload.salt);
      const iv = b64ToBytes(payload.iv);
      const data = b64ToBytes(payload.ct);
      const key = await deriveAesKey(passphrase, salt, payload.iter || 250000);
      const plainBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv },
        key,
        data
      );
      return new TextDecoder().decode(plainBuf);
    }

    async function fetchEncryptedPackage() {
      try {
        const res = await fetch('itinerary.enc.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        try {
          localStorage.setItem('japan-map:itinerary-enc-v1', JSON.stringify(json));
        } catch (_) {}
        return { payload: json, fromCache: false };
      } catch (err) {
        const cached = localStorage.getItem('japan-map:itinerary-enc-v1');
        if (cached) {
          return { payload: JSON.parse(cached), fromCache: true };
        }
        throw err;
      }
    }

    function hideUnlockGate() {
      document.getElementById('unlockGate').classList.add('is-hidden');
    }

    function showUnlockError(msg) {
      const el = document.getElementById('unlockErr');
      el.textContent = msg || '口令错误或数据损坏';
      el.classList.add('show');
    }

    async function applyMarkdownAndStart(md, { fromCache } = {}) {
      const data = parseItineraryMd(md);
      if (!data.points.length) throw new Error('未解析到任何景点');
      try { localStorage.setItem(ITINERARY_CACHE_KEY, md); } catch (_) {}
      applyItinerary(data);
      const defaultDay = resolveDefaultDayId();
      setSelectedDay(defaultDay, { fit: true });
      if (fromCache || isOffline) {
        document.getElementById('pageFooter').textContent =
          (data.meta.footer || '') + ' · 已解锁（缓存）';
        paintAppVersion('cache');
      } else {
        document.getElementById('pageFooter').textContent =
          (data.meta.footer || '') + ' · 行程已加密';
        paintAppVersion('online');
      }
      hideUnlockGate();
    }

    async function tryUnlock(passphrase, { fromCacheEnc } = {}) {
      const btn = document.getElementById('unlockBtn');
      const errEl = document.getElementById('unlockErr');
      errEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = '解密中…';
      try {
        // 优先用内存/刚拉取的 enc；否则重新取
        let payload = window.__encPayload;
        let fromCache = !!fromCacheEnc;
        if (!payload) {
          const pack = await fetchEncryptedPackage();
          payload = pack.payload;
          fromCache = pack.fromCache;
          window.__encPayload = payload;
        }
        const md = await decryptItineraryPayload(payload, passphrase);
        try { sessionStorage.setItem('japan-map:pass-ok', '1'); } catch (_) {}
        // 记住本机会话：不存明文口令，只缓存解密后的 md 供离线
        await applyMarkdownAndStart(md, { fromCache });
      } catch (e) {
        console.error(e);
        showUnlockError(e.name === 'OperationError' ? '口令错误' : (e.message || '解锁失败'));
      } finally {
        btn.disabled = false;
        btn.textContent = '解锁';
      }
    }

    async function bootstrap() {
      updateOnlineState();
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW', err));
        }
      } catch (_) {}

      // 已有解密缓存：直接进（同一浏览器离线续看）
      try {
        const cachedMd = localStorage.getItem(ITINERARY_CACHE_KEY);
        if (cachedMd && cachedMd.includes('## Points')) {
          isOffline = !navigator.onLine;
          updateOnlineState();
          await applyMarkdownAndStart(cachedMd, { fromCache: true });
          return;
        }
      } catch (_) {}

      try {
        const pack = await fetchEncryptedPackage();
        window.__encPayload = pack.payload;
        isOffline = pack.fromCache || !navigator.onLine;
        updateOnlineState();
      } catch (err) {
        console.error(err);
        document.getElementById('unlockTitle').textContent = '无法加载加密行程';
        document.getElementById('unlockErr').textContent =
          '找不到 itinerary.enc.json。请用服务器打开，或先运行 node tools/encrypt-itinerary.mjs';
        document.getElementById('unlockErr').classList.add('show');
        document.getElementById('unlockBtn').disabled = true;
        return;
      }

      const passInput = document.getElementById('unlockPass');
      const unlockBtn = document.getElementById('unlockBtn');
      unlockBtn.addEventListener('click', () => tryUnlock(passInput.value));
      passInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') tryUnlock(passInput.value);
      });
      passInput.focus();
    }

    bootstrap();
  </script>
</body>
</html>
